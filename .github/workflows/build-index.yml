name: Build thumbnails and index

on:
  pull_request:
    types: [opened, synchronize]
    paths: ['maps/**.json']
  push:
    branches: [main]
    paths: ['maps/**.json']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-index.js
      # A pull_request from a fork gets a read-only token (GitHub won't let a workflow push to someone
      # else's fork, and running it with write access via pull_request_target would mean running the PR's
      # own code with that access and our secrets - not worth it). Its thumbnail and index entry are
      # generated by the push trigger once a maintainer merges it instead.
      - name: Commit the generated thumbnails and index
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- maps/ index.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Auto-generate thumbnails and index entries"
            git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fi
      - name: Note that a fork PR's thumbnail comes after it's merged
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::This PR is from a fork, so GitHub won't let this action push the generated thumbnail and index entry onto it. They'll be generated as a follow-up commit once a maintainer merges it."
