name: Build thumbnails and index

on:
  push:
    branches: [main]
    paths: ['maps/**.json']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-index.js
      - name: Commit the generated thumbnails and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- maps/ index.json
          git diff --cached --quiet || git commit -m "Auto-generate thumbnails and index entries"
          git push
