name: Preview a fork's pull request

# A same-repo PR gets its thumbnail and index entry pushed straight onto its own branch (build-index.yml).
# GitHub won't let that happen for a PR from a fork, so this builds the same result on a throwaway branch of
# this repo instead and comments it on the PR, using pull_request_target for the write access that needs -
# but carefully: it checks out this repo's own trusted main (the default for pull_request_target, never the
# fork's code) and only ever reads the PR's maps/*.json as data, through the API (tools/sync-pr-maps.js).
# Nothing from the fork is ever checked out or executed here.

on:
  pull_request_target:
    types: [opened, synchronize, closed]
    paths: ['maps/**.json']

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-pr-maps.js ${{ github.event.pull_request.number }}
      - run: node tools/build-index.js
      - name: Push the preview branch
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="previews/pr-${{ github.event.pull_request.number }}"
          git add -A -- maps/ index.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Preview for #${{ github.event.pull_request.number }}"
            git push origin HEAD:refs/heads/$BRANCH --force
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment the preview on the PR
        if: steps.push.outputs.pushed == 'true'
        run: node tools/comment-pr-preview.js ${{ github.event.pull_request.number }} ${{ steps.push.outputs.branch }} "$RUNNER_TEMP/pr-maps-changed.json"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/previews/pr-${{ github.event.pull_request.number }} || true
